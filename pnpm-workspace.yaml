packages:
  - packages/*
  - tooling/*

allowBuilds:
  esbuild: true
  unrs-resolver: true

catalog:
  '@kizlo/woocommerce': https://pkg.pr.new/@kizlo/woocommerce@3129ca0
  '@tanstack/react-query': ^5.102.0
  '@testing-library/react': ^16.3.3
  '@types/node': ^22.18.12
  happy-dom: ^20.14.5
  kizlo: https://pkg.pr.new/kizlo@3129ca0
  nuqs: ^2.10.0
  tsdown: ^0.15.6
  typescript: ^5.9.3
  use-debounce: ^10.1.1
  vitest: ^3.2.4

catalogs:
  react19:
    react: ^19.2.3
    react-dom: ^19.2.3
    '@types/react': ^19.2.3
    '@types/react-dom': ^19.2.3

minimumReleaseAgeExclude:
  - kizlo@0.25.0
  - '@kizlo/woocommerce@0.11.0'

onlyBuiltDependencies:
  - esbuild
  - unrs-resolver

# Previews rewrite unchanged shared dependencies to URLs; keep the already verified published shared package.
overrides:
  '@kizlo/woocommerce>@kizlo/shared': 0.10.0
  'kizlo>@kizlo/shared': 0.10.0
